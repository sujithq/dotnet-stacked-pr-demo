name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Bookshelf.slnx

      - name: Build
        run: dotnet build Bookshelf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Bookshelf.slnx --configuration Release --no-build
